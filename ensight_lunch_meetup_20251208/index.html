<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏇 경마 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 2.5rem;
        }

        #startButton {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        #startButton:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.4);
        }

        #startButton:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        #raceTrack {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 1200px;
        }

        .track {
            position: relative;
            height: 80px;
            margin: 15px 0;
            background: linear-gradient(to right, #f0f0f0 0%, #f0f0f0 95%, #FFD700 95%, #FFD700 100%);
            border: 2px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .track::after {
            content: '🏁';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
        }

        .horse {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: left 0.05s linear;
        }

        .horse-label {
            position: absolute;
            left: 70px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
            white-space: nowrap;
        }

        .track-number {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 1.2rem;
            color: #666;
        }

        @keyframes celebrate {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.2); }
        }

        .winner {
            animation: celebrate 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <h1>🏇 경마 게임</h1>
    <button id="startButton">경기 시작</button>
    
    <div id="raceTrack">
        <div class="track" id="track1">
            <span class="track-number">1</span>
            <div class="horse" id="horse1" style="background-color: rgb(255, 107, 107); left: 969.605px;">🏇</div>
            <span class="horse-label" id="label1">번개</span>
        </div>
        <div class="track" id="track2">
            <span class="track-number">2</span>
            <div class="horse" id="horse2" style="background-color: rgb(78, 205, 196); left: 929.464px;">🏇</div>
            <span class="horse-label" id="label2">폭풍</span>
        </div>
        <div class="track" id="track3">
            <span class="track-number">3</span>
            <div class="horse" id="horse3" style="background-color: rgb(69, 183, 209); left: 955.001px;">🏇</div>
            <span class="horse-label" id="label3">질풍</span>
        </div>
        <div class="track" id="track4">
            <span class="track-number">4</span>
            <div class="horse" id="horse4" style="background-color: rgb(150, 206, 180); left: 958.415px;">🏇</div>
            <span class="horse-label" id="label4">천둥</span>
        </div>
        <div class="track" id="track5">
            <span class="track-number">5</span>
            <div class="horse" id="horse5" style="background-color: rgb(255, 234, 167); left: 966.075px;">🏇</div>
            <span class="horse-label" id="label5">화살</span>
        </div>
    </div>

    <script>
        const horses = [
            { id: 'horse1', name: '번개', position: 0, element: null },
            { id: 'horse2', name: '폭풍', position: 0, element: null },
            { id: 'horse3', name: '질풍', position: 0, element: null },
            { id: 'horse4', name: '천둥', position: 0, element: null },
            { id: 'horse5', name: '화살', position: 0, element: null }
        ];

        const startButton = document.getElementById('startButton');
        let raceInterval = null;
        let raceFinished = false;

        // 말 요소 초기화
        horses.forEach(horse => {
            horse.element = document.getElementById(horse.id);
        });

        // 경기 시작
        function startRace() {
            // 초기화
            raceFinished = false;
            startButton.disabled = true;
            horses.forEach(horse => {
                horse.position = 0;
                horse.element.style.left = '0px';
                horse.element.classList.remove('winner');
            });

            // 레이스 시작
            raceInterval = setInterval(moveHorses, 50);
        }

        // 말 이동
        function moveHorses() {
            if (raceFinished) return;

            horses.forEach(horse => {
                // 랜덤 속도 (1~5픽셀)
                const speed = Math.random() * 4 + 1;
                horse.position += speed;
                horse.element.style.left = horse.position + 'px';

                // 우승 확인 (트랙 너비의 약 85% 지점)
                checkWinner(horse);
            });
        }

        // 우승자 확인
        function checkWinner(horse) {
            const trackWidth = horse.element.parentElement.offsetWidth;
            const finishLine = trackWidth * 0.85; // 결승선 위치

            if (horse.position >= finishLine && !raceFinished) {
                raceFinished = true;
                clearInterval(raceInterval);
                
                // 우승 애니메이션
                horse.element.classList.add('winner');
                
                // 우승 알림
                setTimeout(() => {
                    alert(`🎉 ${horse.name}이(가) 우승했습니다! 🏆`);
                    startButton.disabled = false;
                    horse.element.classList.remove('winner');
                }, 300);
            }
        }

        // 버튼 이벤트
        startButton.addEventListener('click', startRace);
    </script>


</body></html>
